<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naira to Dollar - Money + Bet App</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#0f172a;color:white;margin:0;padding:20px}
  .card{background:#1e293b;padding:20px;border-radius:16px;max-width:480px;margin:auto}
  h1{text-align:center;font-size:22px}
  p.sub{text-align:center;color:#94a3b8;margin-top:-8px}
  label{display:block;margin:15px 0 5px;color:#cbd5e1}
  input,select{width:100%;padding:14px;border-radius:10px;border:none;font-size:16px}
  button{width:100%;padding:14px;margin-top:18px;background:#22c55e;border:none;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer}
  .result{background:#0f172a;padding:15px;border-radius:12px;margin-top:18px;line-height:1.8}
  .big{font-size:24px;font-weight:bold;color:#22c55e}
  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tabs button{background:#334155;color:white;margin-top:0;padding:10px;font-size:14px}
  .tabs button.active{background:#22c55e}
  .hidden{display:none}
  .red{color:#f87171;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <h1>💵 Money + Bet App</h1>
  <p class="sub">Converter • Daily Income • Bet Calculator</p>
  <div class="tabs">
    <button id="tab1" class="active" onclick="show(1)">Converter</button>
    <button id="tab2" onclick="show(2)">Daily Income</button>
    <button id="tab3" onclick="show(3)">Bet Calc</button>
  </div>
  <div id="page1">
    <label>Amount</label>
    <input id="amount" type="number" value="8500000">
    <label>From</label>
    <select id="from"><option value="NGN">Naira (₦)</option><option value="USD">Dollar ($)</option></select>
    <label>Rate: 1 Dollar =</label>
    <input id="rate" type="number" value="1374">
    <button onclick="convert()">Convert</button>
    <div class="result" id="out1"></div>
  </div>
  <div id="page2" class="hidden">
    <label>How much do you make per day? ($)</label>
    <input id="daily" type="number" value="6186.32">
    <label>Rate: 1 Dollar =</label>
    <input id="rate2" type="number" value="1374">
    <button onclick="calcIncome()">Calculate My Year</button>
    <div class="result" id="out2"></div>
  </div>
  <div id="page3" class="hidden">
    <label>Stake ($) - How much you want to bet</label>
    <input id="stake" type="number" value="1100000">
    <label>Odds (e.g. 1.50 or 10)</label>
    <input id="odds" type="number" step="0.01" value="1.50">
    <button onclick="calcBet()">Calculate Bet</button>
    <div class="result" id="out3"></div>
    <p class="red">⚠️ If you lose, you lose your full stake.</p>
    <button onclick="quickBet(1100000,1.5)" style="background:#334155">Try: $1.1M @ 1.50</button>
    <button onclick="quickBet(1600000,10)" style="background:#334155">Try: $1.6M @ 10.0</button>
  </div>
  <p style="text-align:center;color:#64748b;font-size:12px;margin-top:15px">Update rate manually from Google. Bet responsibly.</p>
</div>
<script>
function show(n){
  [1,2,3].forEach(i=>{
    document.getElementById('page'+i).classList.toggle('hidden', n!==i);
    document.getElementById('tab'+i).classList.toggle('active', n===i);
  });
}
function fmt(n){ return n.toLocaleString('en-US',{maximumFractionDigits:2}) }
function convert(){
  let amt = parseFloat(document.getElementById('amount').value)||0;
  let from = document.getElementById('from').value;
  let rate = parseFloat(document.getElementById('rate').value)||1374;
  let res = from==='NGN' ? amt/rate : amt*rate;
  let sym = from==='NGN' ? '$' : '₦';
  document.getElementById('out1').innerHTML = `Result: <div class="big">${sym}${fmt(res)}</div>Rate used: ₦${fmt(rate)} = $1`;
}
function calcIncome(){
  let d = parseFloat(document.getElementById('daily').value)||0;
  let rate = parseFloat(document.getElementById('rate2').value)||1374;
  let week=d*7, month=d*30, year=d*365;
  document.getElementById('out2').innerHTML = `Per Day: <b>$${fmt(d)} / ₦${fmt(d*rate)}</b><br>Per Week: <b>$${fmt(week)} / ₦${fmt(week*rate)}</b><br>Per Month: <b>$${fmt(month)} / ₦${fmt(month*rate)}</b><br>Per Year: <div class="big">$${fmt(year)} / ₦${fmt(year*rate)}</div>`;
}
function calcBet(){
  let stake = parseFloat(document.getElementById('stake').value)||0;
  let odds = parseFloat(document.getElementById('odds').value)||0;
  let total = stake*odds;
  let profit = total-stake;
  document.getElementById('out3').innerHTML = `Stake: <b>$${fmt(stake)}</b><br>Odds: <b>${odds}</b><br>Total Return if you win: <div class="big">$${fmt(total)}</div>Your Profit / Gain: <b style="color:#22c55e">$${fmt(profit)}</b><br>If you lose: <span class="red">-$${fmt(stake)}</span>`;
}
function quickBet(s,o){ document.getElementById('stake').value=s; document.getElementById('odds').value=o; calcBet(); }
convert(); calcIncome(); calcBet();
</script>
</body>
</html>
